services:
  - type: web
    name: makerslab-backend
    env: node
    region: oregon
    plan: free
    buildCommand: yarn install
    startCommand: yarn start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_SECRET_ID
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: MAIL_FROM_NAME
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_RECIPIENTS
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: SMTP2GO_FROM_NAME
        sync: false
      - key: SMTP2GO_HOST
        sync: false
      - key: SMTP2GO_PASSWORD
        sync: false
      - key: SMTP2GO_PORT
        sync: false
      - key: SMTP2GO_USERNAME
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4
      - key: CONVO_TTL
        value: 3600
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 100
      - key: CONVO_MAX_MESSAGES
        value: 50
